plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android { namespace 'com.myapp132.app'; compileSdk 35
    defaultConfig { applicationId 'com.myapp132.app'; minSdk 21; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    kotlinOptions { jvmTarget = '17' }
}
flutter { source '../..' }
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2' }
